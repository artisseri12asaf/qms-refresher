name: fetch-backgrounds
on:
  push:
    paths: ['.github/workflows/fetch-bg.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download background photos (Unsplash License)
        run: |
          curl -fsSL -o bg-learn.jpg "https://images.unsplash.com/photo-1532094349884-543bc11b234d?w=1000&q=55&fm=jpg"
          curl -fsSL -o bg-practice.jpg "https://images.unsplash.com/photo-1579684453423-f84349ef60b0?w=1000&q=55&fm=jpg"
          curl -fsSL -o bg-tools.jpg "https://images.unsplash.com/photo-1602052577122-f73b9710adba?w=1000&q=55&fm=jpg"
          git rm -q --ignore-unmatch bg-corridor.jpg bg-corridor-sm.jpg
          ls -la bg-*.jpg
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A bg-*.jpg
          git commit -m "Add section background photos" || echo "nothing to commit"
          git push
